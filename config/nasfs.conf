# NASFS Server Configuration
# ---------------------------

# ListenAddr: IP address to bind to. Use 0.0.0.0 to listen on all interfaces.
ListenAddr 0.0.0.0

# Port: TCP port for the server to listen on.
Port 8080

# MaxConn: Maximum number of simultaneous client connections.
MaxConn 128

# ClientTimeout: Client connection timeout in seconds.
ClientTimeout 60

# LogFile: Path to write server logs.
LogFile nasfs.log

# LogLevel: Minimum severity level to log (Debug, Info, Warning, Error).
LogLevel Debug

# DaemonMode: Run the server in the background as a daemon (Yes/No).
DaemonMode No

# PidFile: Path to write the daemon's process ID.
PidFile nasfs.pid

# StorageDir: Directory where uploaded files are stored.
StorageDir ./storage
