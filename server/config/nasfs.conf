# NASFS Server Configuration
# Default configuration file

# Network settings
ListenAddr 0.0.0.0  # IP address to listen on
Port 8080 # Port to listen on
MaxConn 5 # Maximum number of concurrent connections allowed
ClientTimeout 10 # Client timeout in seconds

# Logging settings
LogFile /var/log/nasfs/nasfs-server.log # Log file path
LogLevel Debug # (Debug, Info, Warning, Error)

# Daemon settings
DaemonMode Yes
PidFile /var/run/nasfs/nasfs-server.pid
