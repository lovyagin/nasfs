# NASFS Server Configuration
# Default configuration file

# Network settings
ListenAddr 0.0.0.0  # IP address to listen on
Port 5252 # Port to listen on
MaxConn 5 # Maximum number of concurrent connections allowed
ClientTimeout 60 # Client timeout in seconds

# Logging settings
LogFile /usr/local/var/log/nasfs/nasfs-server.log # Log file path
LogLevel Debug # (Debug, Info, Warning, Error)

# Daemon settings
DaemonMode Yes
PidFile /usr/local/var/run/nasfs/nasfs-server.pid

# File serving settings
StorageDir /usr/local/share/nasfs/storage # Directory for serving files

# Secure channel negotiation
KexAlgorithms ML-KEM-512,Kyber512,ML-KEM-768,Kyber768
CipherAlgorithms xchacha20poly1305
